[project]
name = "ai-fsr"
version = "0.1.0"
description = "AI Full-Stack Ready - CLI for generating production-ready full-stack projects"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "TechWarely", email = "contact@techwarely.com" }
]
keywords = ["fastapi", "tanstack", "postgres", "cli", "generator", "template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer==0.21.1",
]

[dependency-groups]
dev = [
    "ruff==0.14.14",
    "pytest==9.0.2",
]

[project.scripts]
ai-fsr = "ai_fsr.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_fsr"]

# Include the template directory in the package
[tool.hatch.build.targets.wheel.force-include]
"template" = "ai_fsr/template"

# ---------- Ruff ----------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["ai_fsr"]
# The `template/` directory ships a separate project (its own pyproject.toml,
# own ruff config) that is embedded in the wheel for code generation. It is
# not part of the ai-fsr CLI source, so exclude it from the root project's
# lint/format checks.
extend-exclude = ["template"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length (handled by formatter)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["ai_fsr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------- ty (type checker) ----------
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["ai_fsr"]

# ---------- Naming conventions documentation ----------
# Naming conventions:
# - snake_case for functions and variables
# - PascalCase for classes
# - SCREAMING_SNAKE_CASE for constants
# - kebab-case for CLI project names
# These are enforced by ruff's pyflakes (F) rules above.

[tool.pytest.ini_options]
testpaths = ["ai_fsr/tests"]
