[project]
name = "ai-fsr"
version = "0.1.0"
description = "AI Full-Stack Ready - CLI for generating production-ready full-stack projects"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "TechWarely", email = "contact@techwarely.com" }
]
keywords = ["fastapi", "tanstack", "postgres", "cli", "generator", "template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer==0.21.1",
]

[project.scripts]
ai-fsr = "ai_fsr.cli:cli"

[dependency-groups]
dev = [
    "ruff==0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Hatch reads only the repo-root .gitignore (and none at all when the checkout
# sits under an ignored path such as tmp/), so list local junk explicitly.
# Keep in sync with IGNORED_NAMES in ai_fsr/init.py.
exclude = [
    "*.db",
    "*.log",
    ".DS_Store",
    ".coverage",
    ".desloppify/",
    ".idea/",
    ".mypy_cache/",
    ".nitro/",
    ".output/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".tanstack/",
    ".ty_cache/",
    ".venv/",
    ".vscode/",
    "__pycache__/",
    "blob-report/",
    "build/",
    "dist/",
    "htmlcov/",
    "node_modules/",
    "playwright-report/",
    "scorecard.png",
    "test-results/",
    ".env",
    ".env.*",
    "!.env.example",
]

[tool.hatch.build.targets.wheel]
only-include = ["ai_fsr", "template"]
# Editable installs import straight from the checkout (template/ is found
# next to ai_fsr/); the `sources` rewrite below only works for real wheels.
dev-mode-dirs = ["."]

# Ship the template inside the package. Do not use force-include here: it skips
# .gitignore, so local node_modules/.venv/.output would land in the wheel.
[tool.hatch.build.targets.wheel.sources]
"template" = "ai_fsr/template"

# ---------- Ruff ----------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["ai_fsr"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length (handled by formatter)
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["ai_fsr"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
