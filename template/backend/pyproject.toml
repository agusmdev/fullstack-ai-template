[project]
name = "backend-template"
version = "0.1.0"
description = "Generic FastAPI backend template with async SQLAlchemy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sentry-sdk[fastapi]==2.39.0",
    "fastapi==0.118.0",
    "pydantic[email]==2.11.10",
    "sqlalchemy==2.0.43",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "uvicorn==0.37.0",
    "pydantic-settings==2.11.0",
    "httpx==0.28.1",
    "fastapi-filter==2.0.1",
    "fastapi-pagination==0.14.2",
    "alembic==1.16.5",
    "psycopg[binary]==3.3.3",
    "alembic-postgresql-enum==1.8.0",
    "loguru==0.7.3",
    "argon2-cffi==25.1.0",
    "requests-oauthlib==2.0.0",
]

[dependency-groups]
dev = [
    "greenlet==3.2.4",
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "testcontainers[postgres]==4.14.0",
    "ruff==0.13.3",
    "types-requests==2.32.4.20260107",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".ty_cache"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
    "TCH",  # type-checking
    "PYI",  # pyi
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "*__init__*",
    ".venv/*",
]

[tool.coverage.report]
omit = [
    "*__init__*",
    ".venv/*",
    "tests/*",
]
exclude_lines = [
    "if __name__ == .__main__.:"
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
]

[tool.ty.rules]
unresolved-import = "warn"

[tool.ty.analysis]
respect-type-ignore-comments = true
allowed-unresolved-imports = [
    "fastapi_filter.**",
    "fastapi_pagination.**",
]
