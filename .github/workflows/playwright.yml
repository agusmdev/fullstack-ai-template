name: Playwright E2E Tests

on:
  workflow_dispatch:  # Allow manual trigger
  schedule:
    # Run nightly at 2 AM UTC (9 PM EST previous day)
    - cron: '0 2 * * *'
  push:
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start backend and database
        # The backend container applies migrations on boot.
        run: docker compose up -d --build --wait db backend

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install.sh | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install

      - name: Install Playwright
        run: |
          cd frontend
          bunx -y playwright install --with-deps

      - name: Run Playwright tests
        run: |
          cd frontend
          bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: template/frontend/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down
