name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
          package-name: ai-fsr
          bump-minor-pre-major: true
